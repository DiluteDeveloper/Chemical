[package]
name = "chemical-api"
version = "0.1.0"
edition = "2024"

[features]
dev-api = []

[dependencies]
gltf = "1.4.0"
env_logger = "0.10"
log = "0.4"
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
# Needs to match the wgpu version in iced wgpu
wgpu = "27.0.1"

pollster = "0.3"
bytemuck = { version = "1.24", features = ["derive"] }
glam = { version = "0.33", features = [ "bytemuck", "debug-glam-assert", "fast-math" ] }